<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 生图后处理编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{height:100%;margin:0;background:#0b1020;color:#e5e7eb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  input[type=range]{accent-color:#8b5cf6}.checker{background-color:#eef2f7;background-image:linear-gradient(45deg,#d4d9e2 25%,transparent 25%),linear-gradient(-45deg,#d4d9e2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d4d9e2 75%),linear-gradient(-45deg,transparent 75%,#d4d9e2 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .panel{background:#121a2d;border:1px solid #263451}.btn{background:#1d2942;border:1px solid #33466c}.btn:hover{background:#273758}.tab.active{color:#c4b5fd;border-bottom:2px solid #8b5cf6}.canvas-wrap{overflow:hidden;position:relative;cursor:grab}.canvas-wrap.dragging{cursor:grabbing}.tip{position:relative}.tip:hover:after{content:attr(data-tip);position:absolute;z-index:20;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);white-space:nowrap;background:#030712;border:1px solid #374151;padding:4px 7px;border-radius:5px;font-size:11px;color:#d1d5db}
</style>
</head>
<body>
<header class="h-14 flex items-center justify-between px-4 border-b border-slate-700 bg-[#0f172a]">
  <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-violet-600 grid place-items-center font-bold">AI</div><div><div class="font-semibold">AI 生图后处理编辑器</div><div class="text-[10px] text-slate-400">UX 设计师专用 · 本地处理</div></div></div>
  <div class="flex gap-2"><label class="btn tip px-3 py-1.5 rounded text-sm cursor-pointer" data-tip="选择本地图片">导入图片<input id="fileInput" type="file" accept="image/*" hidden></label><button id="exportBtn" class="btn px-3 py-1.5 rounded text-sm">导出图片</button><button id="resetBtn" class="btn px-3 py-1.5 rounded text-sm">重置</button></div>
</header>
<main class="h-[calc(100vh-56px)] grid grid-cols-[290px_1fr_270px] gap-3 p-3">
<aside class="panel rounded-xl overflow-auto p-3 space-y-4">
 <div class="flex gap-1 border-b border-slate-700 pb-2"><button class="tab active text-sm px-2 py-1" data-tab="adjust">调整</button><button class="tab text-sm px-2 py-1" data-tab="draw">标注</button><button class="tab text-sm px-2 py-1" data-tab="mask">抠图/蒙版</button></div>
 <section id="adjustTab" class="space-y-4">
  <div><h3 class="text-xs uppercase text-slate-400 mb-2">基础调整</h3><div id="sliders"></div></div>
  <div><h3 class="text-xs uppercase text-slate-400 mb-2">滤镜与细节</h3><div class="grid grid-cols-2 gap-2"><button class="btn rounded px-2 py-1 text-xs" data-filter="bw">黑白</button><button class="btn rounded px-2 py-1 text-xs" data-filter="gray">去色</button><button class="btn rounded px-2 py-1 text-xs" data-filter="vintage">复古</button><button class="btn rounded px-2 py-1 text-xs" data-filter="none">清除滤镜</button></div><label class="text-xs mt-3 block">高斯模糊 <input id="blur" type="range" min="0" max="12" value="0" class="w-full"></label><label class="text-xs mt-2 block">锐化 <input id="sharpen" type="range" min="0" max="2" step="0.1" value="0" class="w-full"></label></div>
  <div><h3 class="text-xs uppercase text-slate-400 mb-2">变换</h3><div class="grid grid-cols-2 gap-2"><button class="btn rounded px-2 py-1 text-xs" id="rotL">↺ 逆时针</button><button class="btn rounded px-2 py-1 text-xs" id="rotR">↻ 顺时针</button><button class="btn rounded px-2 py-1 text-xs" id="flipX">水平翻转</button><button class="btn rounded px-2 py-1 text-xs" id="flipY">垂直翻转</button></div><label class="text-xs mt-2 block">任意角度 <input id="angle" type="range" min="-180" max="180" value="0" class="w-full"></label></div>
  <div><h3 class="text-xs uppercase text-slate-400 mb-2">裁剪与尺寸</h3><div class="grid grid-cols-2 gap-2"><button class="btn rounded px-2 py-1 text-xs" data-ratio="free">自由</button><button class="btn rounded px-2 py-1 text-xs" data-ratio="1">1:1</button><button class="btn rounded px-2 py-1 text-xs" data-ratio="1.777">16:9</button><button class="btn rounded px-2 py-1 text-xs" data-ratio="1.333">4:3</button></div><div class="grid grid-cols-2 gap-2 mt-2"><input id="outW" type="number" placeholder="宽" class="bg-slate-900 rounded px-2 py-1 text-xs"><input id="outH" type="number" placeholder="高" class="bg-slate-900 rounded px-2 py-1 text-xs"></div><button id="resizeBtn" class="btn rounded px-2 py-1 text-xs w-full mt-2">应用尺寸</button></div>
 </section>
 <section id="drawTab" class="hidden space-y-3"><h3 class="text-xs uppercase text-slate-400">绘图标注</h3><div class="grid grid-cols-2 gap-2"><button class="btn rounded px-2 py-1 text-xs tool" data-tool="brush">画笔</button><button class="btn rounded px-2 py-1 text-xs tool" data-tool="rect">矩形框</button><button class="btn rounded px-2 py-1 text-xs tool" data-tool="circle">圆形框</button><button class="btn rounded px-2 py-1 text-xs tool" data-tool="arrow">箭头</button></div><label class="text-xs block">颜色 <input id="drawColor" type="color" value="#ff3b64"></label><label class="text-xs block">线宽 <input id="drawSize" type="range" min="1" max="40" value="5" class="w-full"></label><div class="flex gap-2"><input id="textInput" class="bg-slate-900 rounded px-2 py-1 text-xs flex-1" placeholder="文字"><button id="addText" class="btn rounded px-2 text-xs">添加</button></div></section>
 <section id="maskTab" class="hidden space-y-3"><h3 class="text-xs uppercase text-slate-400">抠图 & 局部重绘</h3><button id="removeBg" class="bg-violet-600 hover:bg-violet-500 rounded px-2 py-1.5 text-xs w-full">一键去除背景</button><p class="text-[11px] text-slate-400">内置轻量本地启发式分割；可在代码的 loadLocalSegmentationModel() 接入本地 MediaPipe 模型。</p><div class="grid grid-cols-2 gap-2"><button class="btn rounded px-2 py-1 text-xs" id="maskBrush">蒙版画笔</button><button class="btn rounded px-2 py-1 text-xs" id="maskErase">橡皮擦</button></div><label class="text-xs block">蒙版大小 <input id="maskSize" type="range" min="5" max="150" value="40" class="w-full"></label><label class="flex items-center gap-2 text-xs"><input id="maskPreview" type="checkbox"> 红色遮罩预览</label><div class="grid grid-cols-2 gap-2"><button id="invertMask" class="btn rounded px-2 py-1 text-xs">反转蒙版</button><button id="exportMask" class="btn rounded px-2 py-1 text-xs">导出蒙版</button></div><label class="text-xs block">边缘羽化 <input id="feather" type="range" min="0" max="30" value="0" class="w-full"></label></section>
</aside>
<section class="panel rounded-xl flex flex-col min-w-0"><div class="h-10 px-3 flex items-center justify-between border-b border-slate-700 text-xs text-slate-400"><span id="status">请导入图片，或直接粘贴剪贴板图片</span><span>滚轮缩放 · 拖拽平移</span></div><div id="canvasWrap" class="canvas-wrap flex-1 checker grid place-items-center"><canvas id="canvas"></canvas><div id="empty" class="text-center text-slate-500"><div class="text-4xl mb-2">⌁</div><div>将图片拖入此处 / Ctrl+V 粘贴</div></div></div><div class="h-9 px-3 border-t border-slate-700 flex items-center gap-3 text-xs text-slate-400"><span id="zoomText">100%</span><button id="fitBtn" class="btn px-2 py-0.5 rounded">适应窗口</button><button id="undoBtn" class="btn px-2 py-0.5 rounded">撤回</button><button id="redoBtn" class="btn px-2 py-0.5 rounded">重做</button></div></section>
<aside class="panel rounded-xl p-3 overflow-auto"><h3 class="text-xs uppercase text-slate-400 mb-2">实时预览</h3><div id="paramPreview" class="text-xs space-y-1 text-slate-300"></div><div class="border-t border-slate-700 my-4"></div><h3 class="text-xs uppercase text-slate-400 mb-2">取色器</h3><div id="colorPreview" class="text-xs text-slate-400">点击画布取色</div><div class="border-t border-slate-700 my-4"></div><h3 class="text-xs uppercase text-slate-400 mb-2">操作日志</h3><div id="log" class="text-xs space-y-1 text-slate-400"></div></aside>
</main>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 hidden bg-slate-900 border border-slate-600 px-4 py-2 rounded-lg text-sm"></div>
<script>
const $=s=>document.querySelector(s), canvas=$('#canvas'),ctx=canvas.getContext('2d'); let img=null, base=null, state={brightness:0,contrast:0,saturation:0,hue:0,exposure:0,highlights:0,shadows:0,blur:0,sharpen:0,angle:0,flipX:1,flipY:1,filter:'none'}, history=[],future=[], tool='brush', drawing=false, start={x:0,y:0}, scale=1, offset={x:0,y:0}, mask=null,maskMode='paint';
const sliders=[['brightness','亮度',-100,100,0],['contrast','对比度',-100,100,0],['saturation','饱和度',-100,100,0],['hue','色相',-180,180,0],['exposure','曝光',-100,100,0],['highlights','高光',-100,100,0],['shadows','阴影',-100,100,0]];
$('#sliders').innerHTML=sliders.map(([id,n,min,max,v])=>`<label class="text-xs block mb-2">${n} <span id="${id}Val" class="float-right text-slate-500">${v}</span><input id="${id}" data-key="${id}" type="range" min="${min}" max="${max}" value="${v}" class="w-full"></label>`).join('');
function log(s){$('#log').innerHTML=`<div>• ${new Date().toLocaleTimeString()} ${s}</div>`+$('#log').innerHTML} function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function snapshot(){return JSON.stringify({state,mask:mask?Array.from(mask):null,w:canvas.width,h:canvas.height})} function push(){history.push(snapshot());if(history.length>30)history.shift();future=[]}
function apply(){if(!base)return; let w=base.width,h=base.height;canvas.width=w;canvas.height=h;ctx.save();ctx.translate(w/2,h/2);ctx.rotate(state.angle*Math.PI/180);ctx.scale(state.flipX,state.flipY);ctx.translate(-w/2,-h/2);let f=`brightness(${100+state.brightness+state.exposure}%) contrast(${100+state.contrast}%) saturate(${100+state.saturation}%) hue-rotate(${state.hue}deg) blur(${state.blur}px)`;if(state.filter==='bw')f+=' grayscale(1)';if(state.filter==='gray')f+=' saturate(0)';if(state.filter==='vintage')f+=' sepia(.45) contrast(1.05)';ctx.filter=f;ctx.drawImage(base,0,0,w,h);ctx.filter='none';ctx.restore();if(mask&&$('#maskPreview').checked){ctx.fillStyle='rgba(255,30,50,.38)';for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(mask[y*w+x])ctx.fillRect(x,y,2,2)} $('#paramPreview').innerHTML=Object.entries(state).map(([k,v])=>`<div class="flex justify-between"><span>${k}</span><span>${v}</span></div>`).join('');$('#zoomText').textContent=Math.round(scale*100)+'%';}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return toast('请选择图片文件');let u=URL.createObjectURL(file);let im=new Image();im.onload=()=>{if(im.width*im.height>25e6)return toast('图片过大，请控制在 2500 万像素以内');img=im;base=im;canvas.width=im.width;canvas.height=im.height;mask=new Uint8Array(im.width*im.height);$('#empty').classList.add('hidden');history=[];push();apply();fit();log('导入图片 '+im.width+'×'+im.height)};im.src=u}
$('#fileInput').onchange=e=>loadFile(e.target.files[0]);document.addEventListener('paste',e=>{let f=[...(e.clipboardData?.files||[])][0];if(f)loadFile(f)});
sliders.forEach(([id])=>$('#'+id).oninput=e=>{state[id]=+e.target.value;$('#'+id+'Val').textContent=e.target.value;apply()});$('#blur').oninput=e=>{state.blur=+e.target.value;apply()};$('#sharpen').oninput=e=>{state.sharpen=+e.target.value;apply()};$('#angle').oninput=e=>{state.angle=+e.target.value;apply()};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{push();state.filter=b.dataset.filter;apply();log('应用滤镜 '+state.filter)});$('#rotL').onclick=()=>{push();state.angle-=90;apply()};$('#rotR').onclick=()=>{push();state.angle+=90;apply()};$('#flipX').onclick=()=>{push();state.flipX*=-1;apply()};$('#flipY').onclick=()=>{push();state.flipY*=-1;apply()};
document.querySelectorAll('[data-ratio]').forEach(b=>b.onclick=()=>{if(!base)return;let r=b.dataset.ratio;if(r==='free')return;let w=base.width,h=Math.round(w/+r);if(h>base.height){h=base.height;w=Math.round(h*+r)}canvas.width=w;canvas.height=h;ctx.drawImage(base,0,0,w,h);log('预览裁剪比例 '+r)});$('#resizeBtn').onclick=()=>{let w=+$('#outW').value,h=+$('#outH').value;if(!base||!w||!h)return;let t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(canvas,0,0,w,h);base=new Image();base.onload=apply;base.src=t.toDataURL();log('修改尺寸')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['adjust','draw','mask'].forEach(x=>$('#'+x+'Tab').classList.toggle('hidden',x!==b.dataset.tab))});document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>tool=b.dataset.tool);$('#maskBrush').onclick=()=>{tool='mask';maskMode='paint'};$('#maskErase').onclick=()=>{tool='mask';maskMode='erase'};$('#maskPreview').onchange=apply;
function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.onpointerdown=e=>{if(!base)return;drawing=true;start=pos(e);if(tool==='mask'||tool==='brush')paint(e)};canvas.onpointermove=e=>{if(!drawing)return;if(tool==='mask'||tool==='brush')paint(e)};canvas.onpointerup=e=>{if(!drawing)return;drawing=false;let p=pos(e);if(['rect','circle','arrow'].includes(tool)){ctx.strokeStyle=$('#drawColor').value;ctx.lineWidth=+$('drawSize').value;ctx.beginPath();if(tool==='rect')ctx.rect(start.x,start.y,p.x-start.x,p.y-start.y);if(tool==='circle'){let r=Math.hypot(p.x-start.x,p.y-start.y);ctx.arc(start.x,start.y,r,0,Math.PI*2)}if(tool==='arrow'){ctx.moveTo(start.x,start.y);ctx.lineTo(p.x,p.y);let a=Math.atan2(p.y-start.y,p.x-start.x);ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-12*Math.cos(a-.5),p.y-12*Math.sin(a-.5));ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-12*Math.cos(a+.5),p.y-12*Math.sin(a+.5))}ctx.stroke();log('添加标注')}};
function paint(e){let p=pos(e),r=(tool==='mask'?+$('maskSize').value:+$('drawSize').value)/scale; if(tool==='mask'){let x=Math.floor(p.x),y=Math.floor(p.y);for(let j=-r;j<r;j++)for(let i=-r;i<r;i++)if(i*i+j*j<r*r&&x+i>=0&&y+j>=0&&x+i<canvas.width&&y+j<canvas.height)mask[(y+j)*canvas.width+x+i]=maskMode==='erase'?0:255;apply()}else{ctx.fillStyle=$('#drawColor').value;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill()}}
$('#addText').onclick=()=>{if(!base)return;ctx.fillStyle=$('#drawColor').value;ctx.font='24px sans-serif';ctx.fillText($('#textInput').value,40,40);log('添加文字')};
// 本地启发式抠图：以边缘颜色估计背景并写入 alpha。生产环境可将该函数替换为本地 MediaPipe Selfie Segmenter 推理。
$('#removeBg').onclick=()=>{if(!base)return;let d=ctx.getImageData(0,0,canvas.width,canvas.height),p=d.data;let c=[];for(let x=0;x<canvas.width;x++){c.push([p[x*4],p[x*4+1],p[x*4+2]]);let i=((canvas.height-1)*canvas.width+x)*4;c.push([p[i],p[i+1],p[i+2]])}for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){let i=(y*canvas.width+x)*4,near=c.some(v=>Math.hypot(p[i]-v[0],p[i+1]-v[1],p[i+2]-v[2])<35);if(near)p[i+3]=0}ctx.putImageData(d,0,0);log('已完成本地背景去除（启发式）');toast('背景去除完成')};
$('#invertMask').onclick=()=>{if(mask){for(let i=0;i<mask.length;i++)mask[i]=255-mask[i];apply()}};$('#exportMask').onclick=()=>{if(!base)return;let t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;let q=t.getContext('2d'),d=q.createImageData(t.width,t.height);for(let i=0;i<mask.length;i++)d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=mask[i];for(let i=0;i<mask.length;i++)d.data[i*4+3]=255;q.putImageData(d,0,0);download(t.toDataURL(),'mask.png')};
function download(url,name){let a=document.createElement('a');a.href=url;a.download=name;a.click()}$('#exportBtn').onclick=()=>{if(!base)return toast('请先导入图片');let t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;t.getContext('2d').drawImage(canvas,0,0);download(t.toDataURL('image/png'),'edited-image.png');log('导出 PNG')};$('#resetBtn').onclick=()=>{if(!base)return;state={brightness:0,contrast:0,saturation:0,hue:0,exposure:0,highlights:0,shadows:0,blur:0,sharpen:0,angle:0,flipX:1,flipY:1,filter:'none'};sliders.forEach(([id])=>{$('#'+id).value=0;$('#'+id+'Val').textContent='0'});mask.fill(0);apply();log('重置全部修改')};
function fit(){if(!base)return;let r=$('#canvasWrap').getBoundingClientRect();scale=Math.min((r.width-40)/canvas.width,(r.height-40)/canvas.height,1);canvas.style.width=canvas.width*scale+'px';canvas.style.height=canvas.height*scale+'px';apply()}$('#fitBtn').onclick=fit;$('#canvasWrap').onwheel=e=>{e.preventDefault();scale=Math.max(.1,Math.min(4,scale*(e.deltaY<0?1.1:.9)));canvas.style.width=canvas.width*scale+'px';canvas.style.height=canvas.height*scale+'px';apply()};
canvas.onclick=e=>{if(!base)return;let p=pos(e),d=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data,hex='#'+[d[0],d[1],d[2]].map(x=>x.toString(16).padStart(2,'0')).join('');$('#colorPreview').innerHTML=`<span class="inline-block w-4 h-4 rounded mr-2 align-middle" style="background:${hex}"></span>${hex} · RGB(${d[0]}, ${d[1]}, ${d[2]})`};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});window.onresize=fit;
</script></body></html>
