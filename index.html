<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 生图后处理编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17191d;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.tool{border:1px solid #e5e7eb;background:#fff;transition:.16s}.tool:hover{border-color:#a78bfa;box-shadow:0 6px 20px #6d5df31a;transform:translateY(-1px)}.checker{background-color:#fff;background-image:linear-gradient(45deg,#e5e7eb 25%,transparent 25%),linear-gradient(-45deg,#e5e7eb 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e7eb 75%),linear-gradient(-45deg,transparent 75%,#e5e7eb 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.modal{background:#fff;box-shadow:0 28px 80px #0f172a35}.range{appearance:none;height:4px;border-radius:9px;background:#e7e9ee}.range::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:#191b20;cursor:pointer}.btn{height:36px;padding:0 15px;border-radius:7px;border:1px solid #e1e4e9;background:#fff;font-size:13px}.btn:hover{background:#f5f6f8}.btn.primary{background:#17191d;color:#fff;border-color:#17191d}.btn.primary:hover{background:#34373d}.icon{width:36px;height:36px;border:1px solid #e5e7eb;border-radius:7px;display:grid;place-items:center;background:#fff}.chip{padding:6px 16px;border:1px solid #e4e6eb;border-radius:6px;font-size:13px;background:#fff}.chip.active{border-color:#181a1e;background:#fafafa}.hidden{display:none!important}.toast{animation:toast .18s ease}.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 2000px rgba(0,0,0,.5);cursor:move;z-index:5}.crop-box:before,.crop-box:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to right,transparent 33.1%,rgba(255,255,255,.55) 33.3%,rgba(255,255,255,.55) 33.6%,transparent 33.8%,transparent 66.2%,rgba(255,255,255,.55) 66.4%,rgba(255,255,255,.55) 66.7%,transparent 66.9%)}.crop-box:after{background:linear-gradient(to bottom,transparent 33.1%,rgba(255,255,255,.55) 33.3%,rgba(255,255,255,.55) 33.6%,transparent 33.8%,transparent 66.2%,rgba(255,255,255,.55) 66.4%,rgba(255,255,255,.55) 66.7%,transparent 66.9%)}.crop-handle{position:absolute;width:14px;height:14px;background:#fff;border:1px solid #555;border-radius:2px;z-index:2}.crop-handle.nw{left:-8px;top:-8px;cursor:nwse-resize}.crop-handle.ne{right:-8px;top:-8px;cursor:nesw-resize}.crop-handle.sw{left:-8px;bottom:-8px;cursor:nesw-resize}.crop-handle.se{right:-8px;bottom:-8px;cursor:nwse-resize}@keyframes toast{from{transform:translate(-50%,8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.btn:disabled{opacity:.42;cursor:not-allowed}
</style></head>
<body>
<header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between">
 <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-black text-white grid place-items-center font-semibold">AI</div><div><div class="font-semibold">AI 生图后处理编辑器</div><div class="text-[11px] text-slate-400">图片仅在当前浏览器内存中处理</div></div></div>
 <div class="flex gap-2"><label class="btn cursor-pointer flex items-center">导入图片<input id="file" type="file" accept="image/*" hidden></label><button id="paste" class="btn">粘贴图片</button><button id="undo" class="btn" disabled>撤回</button><button id="redo" class="btn" disabled>重做</button><button id="reset" class="btn">恢复原图</button><button class="btn primary" data-open="export">导出</button></div>
</header>
<main class="h-[calc(100vh-64px)] grid grid-cols-[292px_1fr]">
 <aside class="bg-white border-r border-slate-200 p-5 overflow-auto"><div class="text-xs text-slate-400 mb-3">编辑工具</div><div id="tools" class="grid grid-cols-2 gap-3"></div><div class="mt-6 pt-5 border-t border-slate-200"><div class="text-xs text-slate-400 mb-3">当前图片</div><div id="meta" class="text-xs leading-6 text-slate-500">尚未导入图片</div></div></aside>
 <section class="relative overflow-hidden"><div id="stage" class="checker absolute inset-5 rounded-xl border border-slate-200 grid place-items-center overflow-hidden"><canvas id="mainCanvas"></canvas><div id="empty" class="text-center text-slate-400"><div class="text-4xl mb-3">＋</div><div class="text-sm">拖入、粘贴或导入一张图片</div><div class="text-xs mt-2">PNG / JPG / WebP</div></div></div><div class="absolute bottom-7 left-1/2 -translate-x-1/2 bg-white border border-slate-200 shadow-sm rounded-lg px-3 py-2 flex items-center gap-3 text-xs"><button id="zoomOut">−</button><span id="zoomText" class="w-10 text-center">100%</span><button id="zoomIn">＋</button><span class="w-px h-4 bg-slate-200"></span><button id="fit">适应画布</button><span id="colorRead" class="text-slate-400">点击图片取色</span></div></section>
</main>
<div id="overlay" class="fixed inset-0 bg-slate-900/45 backdrop-blur-[2px] hidden z-40 p-5 grid place-items-center"><div class="modal w-[min(1180px,96vw)] h-[min(720px,94vh)] rounded-xl overflow-hidden flex flex-col"><div class="h-16 px-7 flex items-center justify-between border-b border-slate-100"><div><h2 id="modalTitle" class="font-semibold"></h2><p id="modalDesc" class="text-xs text-slate-400 mt-1"></p></div><button id="closeModal" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500">×</button></div><div id="modalBody" class="flex-1 min-h-0 p-7"></div><div class="h-16 px-7 border-t border-slate-100 flex items-center justify-between"><button id="modalReset" class="btn">↶ 全部重置</button><div class="flex gap-2"><button id="modalCancel" class="btn">取消</button><button id="modalApply" class="btn primary">应用</button></div></div></div></div>
<div id="toast" class="toast fixed hidden left-1/2 bottom-7 z-50 bg-black text-white rounded-lg px-4 py-2 text-sm"></div>
<script>
const $=s=>document.querySelector(s), main=$('#mainCanvas'),mctx=main.getContext('2d');
let original=null,current=null,history=[],future=[],zoom=1,modalType='',preview=null,pctx=null,mask=null,drawing=false,maskErase=false,magicEraseMode=false,temp={},cropBox=null,cropRatio=null;
const toolList=[
 ['adjust','图像调整','亮度、对比度、色彩','☼'],['crop','裁剪图片','比例、旋转、翻转','⌗'],
 ['filter','滤镜细节','模糊、锐化、降噪','◐'],['mask','局部重绘','蒙版、提示词与模型生成','✎'],
 ['removebg','一键去背景','本地边缘背景移除','◇'],['upscale','智能超清','本地高质量放大','↗'],
 ['expand','扩展画布','多方向透明扩图','⊞'],['palette','提取色板','识别图片主要颜色','▦'],
 ['resize','修改尺寸','重设宽高与比例','↔'],['export','格式导出','PNG / JPG / WebP','⇩']
];
$('#tools').innerHTML=toolList.map(t=>`<button class="tool rounded-lg p-3 text-left" data-open="${t[0]}"><span class="icon mb-3 text-lg">${t[3]}</span><b class="block text-sm font-medium">${t[1]}</b><span class="text-[11px] text-slate-400 leading-5">${t[2]}</span></button>`).join('');
function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}
function canvasFrom(img){let c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);return c}
function cloneCanvas(c){let n=document.createElement('canvas');n.width=c.width;n.height=c.height;n.getContext('2d').drawImage(c,0,0);return n}
function loadFile(file){if(!file||!file.type.startsWith('image/'))return toast('请选择有效图片');if(file.size>60*1024*1024)return toast('图片不能超过 60MB');let im=new Image();im.onload=()=>{original=canvasFrom(im);current=cloneCanvas(original);history=[];future=[];mask=new Uint8Array(current.width*current.height);$('#empty').classList.add('hidden');renderMain();saveState();toast('图片已导入')};im.src=URL.createObjectURL(file)}
function renderMain(){if(!current)return;main.width=current.width;main.height=current.height;mctx.clearRect(0,0,main.width,main.height);mctx.drawImage(current,0,0);main.style.width=main.width*zoom+'px';main.style.height=main.height*zoom+'px';$('#zoomText').textContent=Math.round(zoom*100)+'%';$('#meta').innerHTML=`尺寸：${current.width} × ${current.height}<br>像素：${(current.width*current.height/1e6).toFixed(2)} MP<br>状态：本地内存处理`;$('#undo').disabled=history.length<2;$('#redo').disabled=!future.length}
function saveState(){if(!current)return;history.push(current.toDataURL());if(history.length>25)history.shift();future=[];renderMain()}
function restoreUrl(url,done){let i=new Image();i.onload=()=>{current=canvasFrom(i);mask=new Uint8Array(current.width*current.height);renderMain();done&&done()};i.src=url}
$('#undo').onclick=()=>{if(history.length<2)return;future.push(history.pop());restoreUrl(history[history.length-1])};$('#redo').onclick=()=>{if(!future.length)return;let u=future.pop();history.push(u);restoreUrl(u)};
$('#reset').onclick=()=>{if(!original)return;current=cloneCanvas(original);mask=new Uint8Array(current.width*current.height);saveState();toast('已恢复原图')};
$('#file').onchange=e=>loadFile(e.target.files[0]);document.addEventListener('paste',e=>{let f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));if(f)loadFile(f)});$('#paste').onclick=async()=>{try{let list=await navigator.clipboard.read();for(let item of list)for(let t of item.types)if(t.startsWith('image/'))return loadFile(await item.getType(t));toast('剪贴板里没有图片')}catch{toast('请直接按 Ctrl+V 粘贴图片')}};
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));$('#closeModal').onclick=$('#modalCancel').onclick=closeModal;
function closeModal(){$('#overlay').classList.add('hidden');preview=null;pctx=null;modalType=''}
function openModal(type){if(!current)return toast('请先导入图片');modalType=type;temp={brightness:0,contrast:0,saturation:0,hue:0,blur:0,sharpen:0,rotate:0,flipX:1,flipY:1};let titles={adjust:['图像调整','实时调节画面亮度与色彩'],crop:['裁剪图片','拖动图片并调整构图、比例和角度'],filter:['滤镜与细节','优化清晰度、模糊和画面质感'],mask:['局部重绘蒙版','白色为重绘区域，黑色为保留区域'],removebg:['一键去背景','在浏览器中分析边缘背景并生成透明结果'],upscale:['智能超清','在本地使用高质量插值放大图片'],expand:['扩展画布','在指定方向增加透明画布'],palette:['图片色板','提取整张图片的主要颜色'],resize:['修改图片尺寸','设置输出宽高和锁定比例'],export:['导出图片','选择格式、质量和透明背景']};$('#modalTitle').textContent=titles[type][0];$('#modalDesc').textContent=titles[type][1];$('#overlay').classList.remove('hidden');buildModal(type)}
function previewShell(side=''){return `<div class="h-full grid grid-cols-[1.08fr_.92fr] gap-6"><div id="previewWrap" class="relative rounded-lg bg-[#f7f7f8] border border-slate-100 grid place-items-center overflow-hidden"><canvas id="preview"></canvas></div><div class="rounded-lg bg-[#fafbfc] border border-slate-100 p-5 overflow-auto">${side}</div></div>`}
function slider(id,name,min,max,val=0,unit=''){return `<div class="mb-7"><div class="flex justify-between text-sm mb-3"><span>${name}</span><span id="val-${id}" class="text-slate-500">${val}${unit}</span></div><input class="range w-full" id="${id}" type="range" min="${min}" max="${max}" value="${val}"></div>`}
function setupPreview(){preview=$('#preview');pctx=preview.getContext('2d');preview.width=current.width;preview.height=current.height;let box=preview.parentElement.getBoundingClientRect(),s=Math.min((box.width-24)/preview.width,(box.height-24)/preview.height,1);preview.style.width=preview.width*s+'px';preview.style.height=preview.height*s+'px';drawPreview()}
function drawPreview(){if(!preview)return;pctx.clearRect(0,0,preview.width,preview.height);pctx.save();pctx.translate(preview.width/2,preview.height/2);pctx.rotate((temp.rotate||0)*Math.PI/180);pctx.scale(temp.flipX||1,temp.flipY||1);pctx.translate(-preview.width/2,-preview.height/2);pctx.filter=`brightness(${100+(+temp.brightness||0)}%) contrast(${100+(+temp.contrast||0)}%) saturate(${100+(+temp.saturation||0)}%) hue-rotate(${+temp.hue||0}deg) blur(${+temp.blur||0}px)`;pctx.drawImage(current,0,0);pctx.restore();if(modalType==='mask'&&mask){pctx.fillStyle='rgba(239,36,71,.38)';for(let y=0;y<preview.height;y+=2)for(let x=0;x<preview.width;x+=2)if(mask[y*preview.width+x])pctx.fillRect(x,y,2,2)}}
function bindRanges(ids){ids.forEach(id=>{$('#'+id).oninput=e=>{temp[id]=+e.target.value;$('#val-'+id).textContent=e.target.value+(id==='hue'||id==='rotate'?'°':'');drawPreview()}})}
function buildModal(type){let body=$('#modalBody'),apply=$('#modalApply');apply.disabled=false;apply.title='';apply.textContent=type==='export'?'下载图片':type==='palette'?'复制色值':'应用';$('#modalReset').onclick=()=>openModal(type);
 if(type==='adjust'){body.innerHTML=previewShell('<h3 class="font-medium text-sm mb-7">图像调整</h3>'+slider('brightness','亮度',-100,100)+slider('contrast','对比度',-100,100)+slider('saturation','饱和度',-100,100)+slider('hue','色相',-180,180,0,'°'));setupPreview();bindRanges(['brightness','contrast','saturation','hue']);apply.onclick=applyFilters}
 else if(type==='filter'){body.innerHTML=previewShell('<h3 class="font-medium text-sm mb-7">细节处理</h3>'+slider('blur','高斯模糊',0,15)+slider('sharpen','锐化',0,20)+`<div class="grid grid-cols-3 gap-2"><button class="chip" data-filter="gray">灰度</button><button class="chip" data-filter="bw">黑白</button><button class="chip" data-filter="vintage">复古</button></div>`);setupPreview();bindRanges(['blur','sharpen']);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');temp.filter=b.dataset.filter;drawPreviewFilter()});apply.onclick=applyFilters}
 else if(type==='crop'){body.innerHTML=previewShell(`<h3 class="font-medium text-sm mb-5">裁剪与变换</h3><div class="flex flex-wrap gap-2 mb-7">${[['free','自由'],['1','1:1'],['1.333','4:3'],['.75','3:4'],['1.777','16:9'],['.5625','9:16']].map(x=>`<button class="chip ratio ${x[0]==='free'?'active':''}" data-r="${x[0]}">${x[1]}</button>`).join('')}</div>${slider('rotate','旋转角度',-180,180,0,'°')}<div class="grid grid-cols-2 gap-2"><button id="flipX" class="btn">水平翻转</button><button id="flipY" class="btn">垂直翻转</button><button id="left90" class="btn">逆时针 90°</button><button id="right90" class="btn">顺时针 90°</button></div><p id="cropSize" class="text-xs text-slate-400 mt-5"></p>`);setupPreview();initCrop();bindRanges(['rotate']);$('#flipX').onclick=()=>{temp.flipX*=-1;drawPreview()};$('#flipY').onclick=()=>{temp.flipY*=-1;drawPreview()};$('#left90').onclick=()=>{temp.rotate=Math.max(-180,temp.rotate-90);$('#rotate').value=temp.rotate;$('#val-rotate').textContent=temp.rotate+'°';drawPreview()};$('#right90').onclick=()=>{temp.rotate=Math.min(180,temp.rotate+90);$('#rotate').value=temp.rotate;$('#val-rotate').textContent=temp.rotate+'°';drawPreview()};document.querySelectorAll('.ratio').forEach(b=>b.onclick=()=>{cropRatio=b.dataset.r==='free'?null:+b.dataset.r;document.querySelectorAll('.ratio').forEach(x=>x.classList.remove('active'));b.classList.add('active');setCropRatio()});apply.onclick=applyTransform}
 else if(type==='mask'){body.innerHTML=previewShell(`<div class="flex items-center justify-between mb-4"><h3 class="font-medium text-sm">局部重绘</h3><span class="text-[11px] text-amber-600 bg-amber-50 rounded px-2 py-1">生成模型未加载</span></div><label class="block text-xs mb-3">提示词<textarea id="inpaintPrompt" class="mt-2 w-full h-20 resize-none border border-slate-200 rounded-lg p-3 text-sm" placeholder="描述希望在蒙版区域生成的内容，例如：将篮子替换为白色陶瓷花瓶"></textarea></label><label class="block text-xs mb-5">反向提示词<input id="negativePrompt" class="mt-2 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="模糊、变形、低质量"></label>${slider('maskSize','画笔大小',5,150,40)}${slider('hardness','画笔硬度',1,100,80)}<div class="grid grid-cols-2 gap-2"><button id="paint" class="btn primary">蒙版画笔</button><button id="erase" class="btn">魔法消除</button><button id="invert" class="btn">反转蒙版</button><button id="clearMask" class="btn">清空蒙版</button></div><div class="grid grid-cols-2 gap-2 mt-3"><button id="exportMask" class="btn">导出蒙版</button><button id="exportTask" class="btn">导出重绘任务</button></div><div id="maskHelp" class="mt-4 rounded-lg bg-slate-100 p-3 text-[11px] leading-5 text-slate-500">蒙版画笔用于 AI 局部重绘。选择“魔法消除”后涂抹物体，松开鼠标即可使用周围像素补全背景。</div>`);setupPreview();bindRanges(['maskSize','hardness']);magicEraseMode=false;maskErase=false;preview.style.cursor='crosshair';preview.onpointerdown=e=>{drawing=true;paintMask(e)};preview.onpointermove=e=>drawing&&paintMask(e);preview.onpointerup=()=>{if(!drawing)return;drawing=false;if(magicEraseMode)applyMagicErase()};preview.onpointercancel=()=>drawing=false;$('#paint').onclick=()=>{magicEraseMode=false;maskErase=false;$('#paint').classList.add('primary');$('#erase').classList.remove('primary');$('#maskHelp').textContent='在图片上涂抹红色蒙版，然后导出蒙版和提示词任务。'};$('#erase').onclick=()=>{magicEraseMode=true;maskErase=false;mask.fill(0);drawPreview();$('#erase').classList.add('primary');$('#paint').classList.remove('primary');$('#maskHelp').textContent='魔法消除已启用：涂抹要移除的物体，松开鼠标后自动补全背景。'};$('#invert').onclick=()=>{mask=Uint8Array.from(mask,x=>255-x);drawPreview()};$('#clearMask').onclick=()=>{mask.fill(0);drawPreview()};$('#exportMask').onclick=exportMask;$('#exportTask').onclick=exportInpaintTask;apply.textContent='生成重绘';apply.disabled=true;apply.title='需要先接入本地 ONNX 重绘模型'}
 else if(type==='removebg'){body.innerHTML=previewShell('<div class="h-full grid place-items-center text-center"><div><div class="text-4xl mb-4">◇</div><h3 class="font-medium">本地背景去除</h3><p class="text-xs text-slate-400 mt-2 leading-6">适合纯色或近似纯色背景。<br>复杂主体需要另行接入分割模型。</p></div></div>');setupPreview();apply.textContent='开始处理';apply.onclick=removeBackground}
 else if(type==='upscale'){body.innerHTML=previewShell('<h3 class="font-medium text-sm mb-6">输出倍数</h3><div class="grid grid-cols-3 gap-2"><button class="chip active scale" data-s="1.5">1.5×</button><button class="chip scale" data-s="2">2×</button><button class="chip scale" data-s="3">3×</button></div><p class="text-xs text-slate-400 mt-6 leading-6">使用浏览器高质量插值放大。真正的 AI 超分需要附带 ONNX 超分模型。</p>');setupPreview();temp.scale=1.5;document.querySelectorAll('.scale').forEach(b=>b.onclick=()=>{temp.scale=+b.dataset.s;document.querySelectorAll('.scale').forEach(x=>x.classList.remove('active'));b.classList.add('active')});apply.onclick=applyUpscale}
 else if(type==='expand'){body.innerHTML=previewShell('<h3 class="font-medium text-sm mb-6">扩展像素</h3><div class="grid grid-cols-2 gap-3"><label class="text-xs">上<input id="top" class="mt-2 field border rounded px-3 py-2 w-full" type="number" value="100"></label><label class="text-xs">下<input id="bottom" class="mt-2 field border rounded px-3 py-2 w-full" type="number" value="100"></label><label class="text-xs">左<input id="left" class="mt-2 field border rounded px-3 py-2 w-full" type="number" value="100"></label><label class="text-xs">右<input id="right" class="mt-2 field border rounded px-3 py-2 w-full" type="number" value="100"></label></div><p class="text-xs text-slate-400 mt-5">生成透明扩展区域，可导出 PNG 后交给 AI 扩图工具。</p>');setupPreview();apply.onclick=applyExpand}
 else if(type==='resize'){body.innerHTML=previewShell(`<h3 class="font-medium text-sm mb-6">图片尺寸</h3><div class="grid grid-cols-2 gap-3"><label class="text-xs">宽度<input id="newW" class="mt-2 border rounded px-3 py-2 w-full" type="number" value="${current.width}"></label><label class="text-xs">高度<input id="newH" class="mt-2 border rounded px-3 py-2 w-full" type="number" value="${current.height}"></label></div><label class="text-xs flex gap-2 mt-4"><input id="lockRatio" type="checkbox" checked>锁定宽高比</label>`);setupPreview();let ratio=current.width/current.height;$('#newW').oninput=()=>{if($('#lockRatio').checked)$('#newH').value=Math.round($('#newW').value/ratio)};$('#newH').oninput=()=>{if($('#lockRatio').checked)$('#newW').value=Math.round($('#newH').value*ratio)};apply.onclick=applyResize}

function drawPreviewFilter(){drawPreview();if(!temp.filter)return;let d=pctx.getImageData(0,0,preview.width,preview.height),a=d.data;for(let i=0;i<a.length;i+=4){let r=a[i],g=a[i+1],b=a[i+2],gray=.299*r+.587*g+.114*b;if(temp.filter==='gray')a[i]=a[i+1]=a[i+2]=gray;if(temp.filter==='bw')a[i]=a[i+1]=a[i+2]=gray>128?255:0;if(temp.filter==='vintage'){a[i]=Math.min(255,r*.9+35);a[i+1]=g*.78+25;a[i+2]=b*.58}}pctx.putImageData(d,0,0)}
function applyFilters(){if(modalType==='filter')drawPreviewFilter();else drawPreview();current=cloneCanvas(preview);saveState();closeModal();toast('调整已应用')}
function initCrop(){let wrap=$('#previewWrap');cropBox=null;$('#cropSize').textContent='请在图片上按住鼠标拖动，创建裁剪区域';let drawingCrop=false,start=null;wrap.onpointerdown=e=>{if(e.target.closest('#cropBox'))return;let q=cropBounds(),wr=wrap.getBoundingClientRect(),x=e.clientX-wr.left,y=e.clientY-wr.top;if(x<q.x||y<q.y||x>q.x+q.w||y>q.y+q.h)return;drawingCrop=true;start={x,y};cropBox={x,y,w:1,h:1};createCropElement();wrap.setPointerCapture(e.pointerId);updateCrop()};wrap.onpointermove=e=>{if(!drawingCrop)return;let wr=wrap.getBoundingClientRect(),q=cropBounds(),x=Math.max(q.x,Math.min(e.clientX-wr.left,q.x+q.w)),y=Math.max(q.y,Math.min(e.clientY-wr.top,q.y+q.h)),w=Math.abs(x-start.x),h=Math.abs(y-start.y);if(cropRatio){h=w/cropRatio;if(h>q.h){h=Math.abs(y-start.y);w=h*cropRatio}}cropBox={x:x<start.x?start.x-w:start.x,y:y<start.y?start.y-h:start.y,w,h};constrainCrop(cropBox);updateCrop()};wrap.onpointerup=()=>{if(!drawingCrop)return;drawingCrop=false;if(!cropBox||cropBox.w<8||cropBox.h<8){$('#cropBox')?.remove();cropBox=null;$('#cropSize').textContent='请拖动鼠标创建更大的裁剪区域';return}attachCropHandlers()}}
function createCropElement(){let old=$('#cropBox');if(old)old.remove();let box=document.createElement('div');box.id='cropBox';box.className='crop-box';box.innerHTML='<i class="crop-handle nw" data-h="nw"></i><i class="crop-handle ne" data-h="ne"></i><i class="crop-handle sw" data-h="sw"></i><i class="crop-handle se" data-h="se"></i>';$('#previewWrap').appendChild(box)}
function attachCropHandlers(){let box=$('#cropBox'),start=null,mode='move',initial=null;if(!box)return;box.onpointerdown=e=>{e.preventDefault();e.stopPropagation();start={x:e.clientX,y:e.clientY};initial={...cropBox};mode=e.target.dataset.h||'move';box.setPointerCapture(e.pointerId)};box.onpointermove=e=>{if(!start)return;let dx=e.clientX-start.x,dy=e.clientY-start.y,b={...initial};if(mode==='move'){b.x+=dx;b.y+=dy}else{if(mode.includes('e'))b.w+=dx;if(mode.includes('s'))b.h+=dy;if(mode.includes('w')){b.x+=dx;b.w-=dx}if(mode.includes('n')){b.y+=dy;b.h-=dy}if(cropRatio){if(mode==='nw'||mode==='se')b.h=b.w/cropRatio;else b.w=b.h*cropRatio}}constrainCrop(b);cropBox=b;updateCrop()};box.onpointerup=box.onpointercancel=()=>start=null}
function cropBounds(){let wrap=$('#previewWrap'),pr=preview.getBoundingClientRect(),wr=wrap.getBoundingClientRect();return{x:pr.left-wr.left,y:pr.top-wr.top,w:pr.width,h:pr.height}}
function constrainCrop(b){let q=cropBounds(),min=40;b.w=Math.max(min,Math.min(b.w,q.x+q.w-b.x));b.h=Math.max(min,Math.min(b.h,q.y+q.h-b.y));b.x=Math.max(q.x,Math.min(b.x,q.x+q.w-b.w));b.y=Math.max(q.y,Math.min(b.y,q.y+q.h-b.h))}
function updateCrop(){let b=$('#cropBox');if(!b)return;b.style.left=cropBox.x+'px';b.style.top=cropBox.y+'px';b.style.width=cropBox.w+'px';b.style.height=cropBox.h+'px';let q=cropBounds(),w=Math.round(cropBox.w/q.w*current.width),h=Math.round(cropBox.h/q.h*current.height);$('#cropSize').textContent=`输出区域：${w} × ${h} px`}
function setCropRatio(){if(!cropBox||!cropRatio)return;let q=cropBounds(),cx=cropBox.x+cropBox.w/2,cy=cropBox.y+cropBox.h/2,w=cropBox.w,h=w/cropRatio;if(h>q.h){h=Math.min(cropBox.h,q.h);w=h*cropRatio}cropBox={x:cx-w/2,y:cy-h/2,w,h};constrainCrop(cropBox);updateCrop()}
function applyTransform(){if(!cropBox)return toast('请先在图片上拖动鼠标创建裁剪区域');let q=cropBounds(),sx=Math.max(0,Math.round((cropBox.x-q.x)/q.w*current.width)),sy=Math.max(0,Math.round((cropBox.y-q.y)/q.h*current.height)),sw=Math.max(1,Math.round(cropBox.w/q.w*current.width)),sh=Math.max(1,Math.round(cropBox.h/q.h*current.height));sw=Math.min(sw,current.width-sx);sh=Math.min(sh,current.height-sy);let cropped=document.createElement('canvas');cropped.width=sw;cropped.height=sh;cropped.getContext('2d').drawImage(current,sx,sy,sw,sh,0,0,sw,sh);let rad=(temp.rotate||0)*Math.PI/180,cos=Math.abs(Math.cos(rad)),sin=Math.abs(Math.sin(rad)),out=document.createElement('canvas');out.width=Math.max(1,Math.round(sw*cos+sh*sin));out.height=Math.max(1,Math.round(sw*sin+sh*cos));let x=out.getContext('2d');x.translate(out.width/2,out.height/2);x.rotate(rad);x.scale(temp.flipX||1,temp.flipY||1);x.drawImage(cropped,-sw/2,-sh/2);current=out;mask=new Uint8Array(out.width*out.height);saveState();closeModal();toast(`已裁剪为 ${out.width} × ${out.height}`)}
function paintMask(e){let rect=preview.getBoundingClientRect(),x=(e.clientX-rect.left)*preview.width/rect.width,y=(e.clientY-rect.top)*preview.height/rect.height,r=+(temp.maskSize||40);for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=r*r){let px=Math.floor(x+i),py=Math.floor(y+j);if(px>=0&&py>=0&&px<preview.width&&py<preview.height)mask[py*preview.width+px]=maskErase?0:255}drawPreview()}
function applyMagicErase(){let w=current.width,h=current.height,total=w*h,selected=0;for(let i=0;i<total;i++)if(mask[i])selected++;if(!selected)return toast('请先涂抹要消除的区域');if(selected>total*.35){mask.fill(0);drawPreview();return toast('消除区域过大，请缩小涂抹范围')}let x=current.getContext('2d'),img=x.getImageData(0,0,w,h),data=img.data,state=new Uint8Array(total),queue=new Int32Array(selected),head=0,tail=0,dirs=[-1,1,-w,w,-w-1,-w+1,w-1,w+1];for(let i=0;i<total;i++)state[i]=mask[i]?0:1;for(let py=1;py<h-1;py++)for(let px=1;px<w-1;px++){let i=py*w+px;if(state[i]!==0)continue;let edge=false;for(let d of dirs)if(state[i+d]===1){edge=true;break}if(edge){state[i]=2;queue[tail++]=i}}while(head<tail){let i=queue[head++],r=0,g=0,b=0,a=0,n=0;for(let d of dirs){let j=i+d;if(j>=0&&j<total&&state[j]===1){r+=data[j*4];g+=data[j*4+1];b+=data[j*4+2];a+=data[j*4+3];n++}}if(n){data[i*4]=r/n;data[i*4+1]=g/n;data[i*4+2]=b/n;data[i*4+3]=a/n}state[i]=1;let px=i%w,py=Math.floor(i/w);for(let d of dirs){let j=i+d;if(j>=0&&j<total&&state[j]===0&&px>0&&px<w-1&&py>0&&py<h-1){state[j]=2;queue[tail++]=j}}}for(let pass=0;pass<2;pass++){let copy=new Uint8ClampedArray(data);for(let py=1;py<h-1;py++)for(let px=1;px<w-1;px++){let i=py*w+px;if(!mask[i])continue;for(let c=0;c<3;c++){let sum=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)sum+=copy[((py+yy)*w+px+xx)*4+c];data[i*4+c]=sum/9}}}x.putImageData(img,0,0);mask.fill(0);saveState();drawPreview();toast('魔法消除完成')}
function exportMask(){let c=document.createElement('canvas');c.width=current.width;c.height=current.height;let d=c.getContext('2d').createImageData(c.width,c.height);for(let i=0;i<mask.length;i++){d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=mask[i];d.data[i*4+3]=255}c.getContext('2d').putImageData(d,0,0);download(c.toDataURL(),'inpaint-mask.png')}
function exportInpaintTask(){let prompt=$('#inpaintPrompt').value.trim();if(!prompt)return toast('请先输入重绘提示词');let task={type:'local-inpaint',prompt,negativePrompt:$('#negativePrompt').value.trim(),width:current.width,height:current.height,maskRule:'white=repaint, black=preserve',createdAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(task,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);download(url,'inpaint-task.json');setTimeout(()=>{URL.revokeObjectURL(url);exportMask()},150);toast('已导出提示词任务和蒙版')}
function removeBackground(){let c=cloneCanvas(current),x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),a=d.data,corners=[[0,0],[c.width-1,0],[0,c.height-1],[c.width-1,c.height-1]],bg=[0,0,0];corners.forEach(([px,py])=>{let i=(py*c.width+px)*4;bg[0]+=a[i]/4;bg[1]+=a[i+1]/4;bg[2]+=a[i+2]/4});for(let i=0;i<a.length;i+=4){let dist=Math.hypot(a[i]-bg[0],a[i+1]-bg[1],a[i+2]-bg[2]);if(dist<55)a[i+3]=Math.max(0,Math.min(255,(dist-18)*7))}x.putImageData(d,0,0);current=c;saveState();closeModal();toast('背景处理完成')}
function applyUpscale(){let c=document.createElement('canvas'),s=temp.scale||2;c.width=Math.round(current.width*s);c.height=Math.round(current.height*s);let x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(current,0,0,c.width,c.height);current=c;mask=new Uint8Array(c.width*c.height);saveState();closeModal();toast('图片已放大')}
function applyExpand(){let t=+$('input#top').value||0,b=+$('input#bottom').value||0,l=+$('input#left').value||0,r=+$('input#right').value||0,c=document.createElement('canvas');c.width=current.width+l+r;c.height=current.height+t+b;c.getContext('2d').drawImage(current,l,t);current=c;mask=new Uint8Array(c.width*c.height);saveState();closeModal();toast('画布已扩展')}
function applyResize(){let w=+$('#newW').value,h=+$('#newH').value;if(!w||!h||w*h>40000000)return toast('请输入有效尺寸，且不超过 4000 万像素');let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(current,0,0,w,h);current=c;mask=new Uint8Array(w*h);saveState();closeModal();toast('尺寸已修改')}
function extractPalette(){let c=document.createElement('canvas');c.width=80;c.height=80;c.getContext('2d').drawImage(current,0,0,80,80);let a=c.getContext('2d').getImageData(0,0,80,80).data,bins={};for(let i=0;i<a.length;i+=16){let k=[a[i],a[i+1],a[i+2]].map(v=>Math.min(255,Math.round(v/40)*40));let key=k.join(',');bins[key]=(bins[key]||0)+1}return Object.keys(bins).sort((a,b)=>bins[b]-bins[a]).slice(0,6).map(k=>'#'+k.split(',').map(v=>(+v).toString(16).padStart(2,'0')).join(''))}
function exportImage(){let f=$('#format').value,q=(+$('#quality').value||92)/100,m=f==='jpeg'?'image/jpeg':'image/'+f;download(current.toDataURL(m,q),'edited-image.'+(f==='jpeg'?'jpg':f));toast('图片已导出');closeModal()}
function download(url,name){let a=document.createElement('a');a.href=url;a.download=name;a.click()}
$('#zoomIn').onclick=()=>{zoom=Math.min(4,zoom*1.15);renderMain()};$('#zoomOut').onclick=()=>{zoom=Math.max(.1,zoom/1.15);renderMain()};$('#fit').onclick=()=>{if(!current)return;let r=$('#stage').getBoundingClientRect();zoom=Math.min((r.width-50)/current.width,(r.height-50)/current.height,1);renderMain()};$('#stage').onwheel=e=>{if(!current)return;e.preventDefault();zoom=Math.max(.1,Math.min(4,zoom*(e.deltaY<0?1.08:.92)));renderMain()};main.onclick=e=>{if(!current)return;let r=main.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*main.width/r.width),y=Math.floor((e.clientY-r.top)*main.height/r.height),d=mctx.getImageData(x,y,1,1).data,h='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');$('#colorRead').textContent=h+' · RGB('+d[0]+','+d[1]+','+d[2]+')'};
